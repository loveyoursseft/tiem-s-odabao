<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHARACTER LIBRARY</title>

<style>

/* =====================================================
   CÀI ĐẶT CHUNG
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #ffffff 0%,
            #f3f0ec 55%,
            #e8e3dc 100%
        );

    color: #292929;

    overflow-x: hidden;
}


/* =====================================================
   HIỆU ỨNG CHUYỂN TRANG
===================================================== */

.page-transition {
    position: fixed;

    inset: 0;

    background: #171717;

    z-index: 9999;

    pointer-events: none;

    animation: pageEnter 1.1s ease forwards;
}

@keyframes pageEnter {
.page-transition {
    position: fixed;
    inset: 0;

    background: #171717;

    z-index: 9999;

    pointer-events: none;

    animation:
        slideRight 1s cubic-bezier(.77,0,.18,1)
        forwards;
}

@keyframes slideRight {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(100%);
    }

}


/* =====================================================
   HIỆU ỨNG HẠT / ÁNH SÁNG
===================================================== */

.particles {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1;

    overflow: hidden;
}

.particle {

    position: absolute;

    width: 4px;
    height: 4px;

    background: rgba(255,255,255,0.7);

    border-radius: 50%;

    animation:
        floatParticle linear infinite;

}

@keyframes floatParticle {

    0% {
        transform:
            translateY(100vh)
            scale(0);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-10vh)
            scale(1);
        opacity: 0;
    }

}


/* =====================================================
   TRANG BÌA
===================================================== */

.cover {

    height: 520px;

    position: relative;

    overflow: hidden;

    background-image:

        linear-gradient(
            to bottom,
            rgba(0,0,0,0.05),
            rgba(0,0,0,0.78)
        ),

        /* ✏️ CHỈNH ẢNH BÌA Ở ĐÂY */

        url("https://i.pinimg.com/736x/a1/46/4a/a1464a768a5a6ee45e0a9134423dd0f0.jpg");

    background-size: cover;

    background-position: center;

    animation: coverZoom 12s ease-in-out infinite alternate;
}

@keyframes coverZoom {

    from {
        background-size: 100%;
    }

    to {
        background-size: 108%;
    }

}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    padding: 25px 7%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: white;

    z-index: 10;
}


.logo {

    display: flex;

    align-items: center;

    gap: 13px;

    font-size: 20px;

    font-weight: 700;

    letter-spacing: 3px;
}


.logo-icon {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(255,255,255,0.9);

    color: #222;

    font-size: 22px;

    box-shadow:
        0 0 25px rgba(255,255,255,0.35);

    animation:
        iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }

}


/* =====================================================
   NÚT NHẠC
===================================================== */

.music-button {

    width: 48px;
    height: 48px;

    border: 1px solid rgba(255,255,255,0.4);

    background:
        rgba(0,0,0,0.25);

    backdrop-filter: blur(10px);

    color: white;

    border-radius: 50%;

    cursor: pointer;

    font-size: 19px;

    transition: 0.3s;
}

.music-button:hover {

    transform: scale(1.12);

    background:
        rgba(255,255,255,0.2);
}


/* =====================================================
   COVER CONTENT
===================================================== */

.cover-content {

    position: absolute;

    left: 8%;

    bottom: 75px;

    color: white;

    z-index: 5;

    animation:
        coverText 1.4s ease;
}

@keyframes coverText {

    from {

        opacity: 0;

        transform:
            translateY(35px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


.cover-content h1 {

    font-size:
        clamp(40px, 7vw, 78px);

    letter-spacing: 8px;

    font-weight: 700;

    text-shadow:
        0 5px 30px rgba(0,0,0,0.5);
}


.cover-content p {

    margin-top: 12px;

    font-size: 16px;

    opacity: 0.9;

    letter-spacing: 2px;
}


/* =====================================================
   CATEGORY
===================================================== */

.category-bar {

    width: 90%;

    margin:
        -35px auto 35px;

    padding: 12px;

    background:
        rgba(255,255,255,0.9);

    backdrop-filter:
        blur(15px);

    border-radius: 18px;

    display: flex;

    gap: 8px;

    overflow-x: auto;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.1);

    position: relative;

    z-index: 20;
}


.category {

    border: none;

    background: transparent;

    padding:
        12px 22px;

    border-radius: 12px;

    white-space: nowrap;

    cursor: pointer;

    font-size: 14px;

    transition:
        0.35s;
}


.category:hover {

    transform:
        translateY(-2px);

}


.category.active {

    background: # FFB6C1;

    color: white;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.2);
}


/* =====================================================
   SEARCH
===================================================== */

.search-wrapper {

    width: 90%;

    margin:
        0 auto 30px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.total {

    color: # FFB6C1;

    font-size: 14px;
}


.search {

    width: 280px;

    padding:
        13px 20px;

    border:
        1px solid #ddd;

    outline: none;

    border-radius: 30px;

    background: white;

    transition:
        0.3s;
}


.search:focus {

    width: 330px;

    border-color:
        # FFB6C1;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.07);
}


/* =====================================================
   CHARACTER GRID
===================================================== */

.characters {

    width: 90%;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(230px, 1fr)
        );

    gap: 25px;

    padding-bottom: 100px;
}


/* =====================================================
   CHAR CARD
===================================================== */

.char-card {

    background:pink;

    border-radius: 22px;

    overflow: hidden;

    cursor: pointer;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.07);

    transition:
        transform 0.5s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.5s;

    animation:
        cardAppear 0.7s ease both;
}


.char-card:hover {

    transform:
        translateY(-10px)
        scale(1.015);

    box-shadow:
        0 20px 45px rgba(0,0,0,0.15);
}


@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


.char-image-wrapper {

    height: 320px;

    overflow: hidden;

    position: relative;
}


.char-image {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition:
        transform 0.7s;
}


.char-card:hover
.char-image {

    transform:
        scale(1.08);
}


.char-number {

    position: absolute;

    top: 13px;
    left: 13px;

    padding:
        7px 11px;

    border-radius: 20px;

    color: white;

    background:
        rgba(0,0,0,0.45);

    backdrop-filter:
        blur(8px);

    font-size: 11px;

    letter-spacing: 2px;

    z-index: 2;
}


.char-info {

    padding: 18px;
}


.char-name {

    font-size: 21px;

    font-weight: 600;

    margin-top: 4px;
}


.char-description {

    color: #777;

    font-size: 13px;

    line-height: 1.6;

    margin-top: 7px;
}


/* =====================================================
   TAG
===================================================== */

.tags {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 12px;
}


.tag {

    padding:
        5px 10px;

    background:
        #eeeae5;

    border-radius: 20px;

    font-size: 10px;

    color: #666;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.72);

    backdrop-filter:
        blur(10px);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 1000;
}


.modal.active {

    display: flex;

    animation:
        modalBackground 0.4s ease;
}


@keyframes modalBackground {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


.modal-content {

    width:
        min(950px, 95%);

    max-height: 90vh;

    overflow-y: auto;

    background:
        #fff;

    border-radius: 28px;

    position: relative;

    padding: 30px;

    animation:
        modalOpen 0.55s cubic-bezier(.2,.8,.2,1);
}


@keyframes modalOpen {

    from {

        opacity: 0;

        transform:
            translateY(50px)
            scale(0.92);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


.close {

    position: absolute;

    right: 18px;
    top: 18px;

    width: 40px;
    height: 40px;

    border: none;

    border-radius: 50%;

    background: #eee;

    font-size: 22px;

    cursor: pointer;

    z-index: 5;

    transition: 0.3s;
}


.close:hover {

    transform:
        rotate(90deg);

    background: #222;

    color: white;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {

    display: grid;

    grid-template-columns:
        320px 1fr;

    gap: 35px;
}


.profile-image {

    width: 100%;

    height: 470px;

    object-fit: cover;

    border-radius: 20px;
}


.profile-number {

    color: #999;

    font-size: 12px;

    letter-spacing: 3px;
}


.profile h2 {

        5px 0 15px;
}


.profile-section {

}


.profile-section h3 {

    font-size: 13px;

    text-transform:
        uppercase;

    letter-spacing: 2px;

    margin-bottom: 8px;
}


.profile-section p {

    color: #666;

    line-height: 1.8;

    font-size: 14px;
}


/* =====================================================
   CÂU MỞ ĐẦU
===================================================== */

.opening {

    padding: 20px;

    margin-top: 10px;

    border-left:
        3px solid #333;

    background:
        #f6f4f1;

    font-style: italic;

    border-radius:
        0 12px 12px 0;
}


/* =====================================================
   FOOTER
===================================================== */

footer {

    padding: 30px;

    text-align: center;

    color: #999;

    font-size: 12px;

    letter-spacing: 1px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    .cover {

    }

    .search {
        width: 100%;
    }

    .search:focus {
        width: 100%;
    }

    .profile {
        grid-template-columns: 1fr;
    }

    .profile-image {
        height: 380px;
    }

}

</style>

/* =====================================================
   HIỂN THỊ CHARACTER
===================================================== */

function displayCharacters(list) {

    const container =
        document.getElementById(
            "characterList"
        );


    container.innerHTML = "";


    document.getElementById(
        "totalCharacters"
    ).textContent = list.length;


    list.forEach(
        (character, index) => {


        const card =
            document.createElement("div");


        card.className = Hạo Hiên
            "char-card";


        card.style.animationDelay =
            `${index * 0.08}s`;


        card.innerHTML = `

            <div class="char-image-wrapper">

                <img
                    src="${character.image}"
                    class="char-image"
                    alt="${character.name}">

                <div class="char-number">
                    ${character.id}
                </div>

            </div>


            <div class="char-info">

                <div class="char-name">
                    ${character.name}
                </div>


                <div class="char-description">
                    ${character.description}
                </div>


                <div class="tags">

                    ${character.tags.map(
                        tag => `

                        <span class="tag">
                            #${tag}
                        </span>

                    `
                    ).join("")}

                </div>

            </div>

        `;


        card.onclick = () => {

            playSound(https://tiengdong.com/tong-hop-am-thanh-ma-thuat-anh-sao-lap-lanh?utm_source=copylink&utm_medium=share_button&utm_campaign=shared_from_tiengdong.com&utm_content=vi-18h51-12-08-2026
                document.getElementById(
                    "openSound"
                )
            );

            openCharacter(character);

        };


        container.appendChild(card);

    });

}



/* =====================================================
   LỌC
===================================================== */

function filterCharacters(
    category,
    button
) {


    playSound(https://tiengdong.com/tong-hop-am-thanh-ma-thuat-anh-sao-lap-lanh?utm_source=copylink&utm_medium=share_button&utm_campaign=shared_from_tiengdong.com&utm_content=vi-18h51-12-08-2026
        document.getElementById(
            "clickSound"
        )
    );


    document
        .querySelectorAll(".category")
        .forEach(
            btn =>
            btn.classList.remove(
                "active"
            )
        );


    button.classList.add(
        "active"
    );


    if (category === "all") {

        displayCharacters(
            characters
        );

    }

    else {

        const filtered =
            characters.filter(
                character =>
                character.category ===
                category
            );


        displayCharacters(
            filtered
        );

    }

}



/* =====================================================
   TÌM KIẾM
===================================================== */

function searchCharacter() {


    const keyword =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const result =
        characters.filter(
            character => {


            const nameMatch =
                character.name
                .toLowerCase()
                .includes(keyword);


            const tagMatch =
                character.tags.some(
                    tag =>
                    tag
                    .toLowerCase()
                    .includes(keyword)
                );


            return (
                nameMatch ||
                tagMatch
            );

        });


    displayCharacters(
        result
    );

}



/* =====================================================
   MỞ PROFILE
===================================================== */

function openCharacter(
    character
) {


    document.getElementById(
        "modalNumber"
    ).textContent =
        character.id;


    document.getElementById(
        "modalName"
    ).textContent =
        character.name;


    document.getElementById(
        "modalImage"
    ).src =
        character.image;


    document.getElementById(
        "modalInfo"
    ).innerHTML =
        character.info;


    document.getElementById(
        "modalStory"
    ).textContent =
        character.story;


    document.getElementById(
        "modalOpening"
    ).textContent =
        character.opening;


    document.getElementById(
        "modalTags"
    ).innerHTML =

        character.tags.map(
            tag => `

            <span class="tag">
                #${tag}
            </span>

        `
        ).join("");


    document.getElementById(
        "characterModal"
    ).classList.add(
        "active"
    );

}



/* =====================================================
   ĐÓNG PROFILE
===================================================== */

function closeModal() {

    document.getElementById(
        "characterModal"
    ).classList.remove(
        "active"
    );

}



/* =====================================================
   CLICK RA NGOÀI MODAL
===================================================== */

document
    .getElementById(
        "characterModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();

            }

        }
    );



/* =====================================================
   NHẠC NỀN
===================================================== */

const music =
    document.getElementById(
        "backgroundMusic"
    );


const musicButton =
    document.getElementById(
        "musicButton"
    );


let musicPlaying = false;



function toggleMusic() {


    if (!musicPlaying) {

        music.play()
        .then(() => {

            musicPlaying = true;

            musicButton.textContent =
                "🔊";

        })
        .catch(() => {

            alert(
                "Trình duyệt đã chặn nhạc. " +
                "Hãy bấm lại nút nhạc."
            );

        });

    }

    else {

        music.pause();

        musicPlaying = false;

        musicButton.textContent =
            "♫";

    }

}



/* =====================================================
   PHÁT HIỆU ỨNG ÂM THANH
===================================================== */

function playSound(audio) {


    if (
        !audio ||
        !audio.src ||
        audio.src.includes(
            "YOUR_"
        )
    ) {

        return;

    }


    audio.currentTime = 0;

    audio.play()
    .catch(() => {});

}



/* =====================================================
   TẠO HẠT ÁNH SÁNG
===================================================== */

function createParticles() {


    const container =
        document.getElementById(
            "particles"
        );


    for (
        let i = 0;
        i < 35;
        i++
    ) {


        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.style.left =
            Math.random() * 100 +
            "%";


        particle.style.animationDuration =
            5 +
            Math.random() * 10 +
            "s";


        particle.style.animationDelay =
            Math.random() * 8 +
            "s";


        particle.style.opacity =
            Math.random();


        container.appendChild(
            particle
        );

    }

}



/* =====================================================
   KHỞI ĐỘNG
===================================================== */

createParticles();

displayCharacters(
    characters
);
